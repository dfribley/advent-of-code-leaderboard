name: Release & Publish

on:
  push:
    tags:
    - 'v*'

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.check_release.outputs.upload_url || steps.create_release.outputs.upload_url }}
    steps:
      - name: Check for Existing Release
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if output=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json uploadUrl 2>&1); then
            upload_url=$(jq -er '.uploadUrl | select(type == "string" and length > 0)' <<< "$output")
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "upload_url=$upload_url" >> "$GITHUB_OUTPUT"
          elif [[ "$output" == *"release not found"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "An unexpected error occurred: $output"
            exit 1
          fi

      - name: Create Release
        id: create_release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          latest_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')

          [[ -n "$latest_tag" ]] || { echo "No latest release tag found" >&2; exit 1; }

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Release $TAG" \
            --generate-notes \
            --notes-start-tag "$latest_tag"

          upload_url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json uploadUrl --jq '.uploadUrl | select(type == "string" and length > 0)')
          if [[ -z "$upload_url" ]]; then
            echo "Release $TAG was created, but its upload URL could not be retrieved." >&2
            exit 1
          fi
          echo "upload_url=$upload_url" >> "$GITHUB_OUTPUT"

  build_release:
    name: Build Release
    needs: create_release
    strategy:
      matrix:
        os: [ubuntu-latest]
        runtime: [linux-x64, win-x64, osx-x64, osx-arm64]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Application
        shell: bash
        run: |
          TAG=${{ github.ref_name }}
          
          cd AoC.Leaderboard.Cli
          dotnet publish -c Release \
            -r ${{ matrix.runtime }} \
            --self-contained true \
            -o "../aoclb-${{ matrix.runtime }}" \
            /p:Version=${TAG#v} \
            /p:DebugType=None \
            /p:DebugSymbols=false

      - name: Pack
        id: pack
        shell: bash
        run: |
          release_name="aoclb-${{ matrix.runtime }}"
          
          if [ "${{ matrix.runtime }}" == "win-x64" ]; then
            release_asset="${release_name}.zip"
            release_asset_type="application/zip"

            7z a -tzip "${release_asset}" "./${release_name}/*"
          else
            release_asset="${release_name}.tar.gz"
            release_asset_type="application/gzip"

            tar czvf "${release_asset}" "$release_name"
          fi

          echo "asset_name=${release_asset}" >> $GITHUB_OUTPUT
          echo "release_asset_type=${release_asset_type}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./${{ steps.pack.outputs.asset_name }}
          asset_name: ${{ steps.pack.outputs.asset_name }}
          asset_content_type: ${{ steps.pack.outputs.release_asset_type }}

  update_homebrew_tap:
    name: Update Homebrew Tap
    needs: build_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Tap
        uses: actions/checkout@v4
        with:
          repository: dfribley/homebrew-tools
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      
      - name: Update formula from release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          
          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          release = json.loads(subprocess.check_output(
            ["gh", "release", "view", tag, "--repo", repo, "--json", "assets"],
            text=True,
          ))
          formula = Path("Formula/aoclb.rb")
          text = formula.read_text()
        
          for runtime in ("osx-x64", "osx-arm64", "linux-x64"):
            name = f"aoclb-{runtime}.tar.gz"
            assets = [asset for asset in release["assets"] if asset["name"] == name]
            if len(assets) != 1:
              raise SystemExit(f"Expected one asset named {name}; found {len(assets)}")
            
            digest = assets[0].get("digest")
            if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"Missing or invalid SHA-256 digest for {name}: {digest}")
            sha256 = digest.removeprefix("sha256:")
            
            pattern = re.compile(
              r'(?m)^([ \t]*url "https://github\.com/'
              + re.escape(repo)
              + r'/releases/download/)[^"/]+(/aoclb-'
              + re.escape(runtime)
              + r'\.tar\.gz"\n[ \t]*sha256 ")[a-fA-F0-9]{64}(")'
            )
            text, count = pattern.subn(
              lambda match: match[1] + tag + match[2] + sha256 + match[3],
              text,
            )
            if count != 1:
              raise SystemExit(f"Expected one URL/hash pair for {runtime}; found {count}")
            
          formula.write_text(text)
          PY
          
      - name: Commit and push changes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/aoclb.rb; then
            echo "Formula is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/aoclb.rb
          git commit -m "Update aoclb to $TAG"
          git push origin HEAD:main